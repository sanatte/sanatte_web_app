@if (isOpen()) {
  <div class="fixed inset-0 z-[60] bg-on-background/40 backdrop-blur-sm flex items-center justify-center p-4"
       (click)="cancel.emit()">

    <div class="bg-white w-full max-w-lg rounded-lg shadow-2xl flex flex-col overflow-hidden max-h-[90vh]"
         (click)="$event.stopPropagation()">

      <div class="px-8 py-6 border-b border-outline-variant/20">
        <div class="flex items-center gap-3 mb-1">
          <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-primary">add_business</span>
          </div>
          <h2 class="font-heading text-headline-md font-bold text-on-surface">{{ t.form.title }}</h2>
        </div>
        <p class="text-label-md font-heading text-on-surface-variant mt-1">{{ t.form.subtitle }}</p>
      </div>

      <form id="location-form" [formGroup]="form" (ngSubmit)="onSubmit()" class="p-8 space-y-5 overflow-y-auto">

        <div class="space-y-2">
          <label for="location-name" class="text-label-md font-heading font-semibold text-on-surface">
            {{ t.form.name }} <span class="text-error">{{ c.form.required }}</span>
          </label>
          <input id="location-name" formControlName="name" [placeholder]="t.form.namePlaceholder"
                 class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 outline-none
                        focus:ring-2 focus:ring-primary/50 text-label-md font-heading"/>
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <p class="text-label-sm text-error">{{ t.form.nameRequired }}</p>
          }
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label for="location-type" class="text-label-md font-heading font-semibold text-on-surface">{{ t.form.type }}</label>
            <select id="location-type" formControlName="type"
                    class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 outline-none
                           focus:ring-2 focus:ring-primary/50 text-label-md font-heading cursor-pointer">
              @for (option of typeOptions; track option[0]) {
                <option [value]="option[0]">{{ option[1] }}</option>
              }
            </select>
          </div>
          <div class="space-y-2">
            <label for="location-model" class="text-label-md font-heading font-semibold text-on-surface">{{ t.form.salesModel }}</label>
            <select id="location-model" formControlName="salesModel"
                    class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 outline-none
                           focus:ring-2 focus:ring-primary/50 text-label-md font-heading cursor-pointer">
              @for (option of salesModelOptions; track option[0]) {
                <option [value]="option[0]">{{ option[1] }}</option>
              }
            </select>
          </div>
        </div>

        <div class="space-y-2">
          <label for="location-commission" class="text-label-md font-heading font-semibold text-on-surface">{{ t.form.commission }}</label>
          <input id="location-commission" formControlName="commissionPercent" type="number" min="0" max="100"
                 class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 outline-none
                        focus:ring-2 focus:ring-primary/50 text-label-md font-heading
                        disabled:opacity-40 disabled:cursor-not-allowed"/>
          <p class="text-label-sm font-heading text-on-surface-variant">{{ t.form.commissionHint }}</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label for="location-contact" class="text-label-md font-heading font-semibold text-on-surface">{{ t.form.contact }}</label>
            <input id="location-contact" formControlName="contactName" [placeholder]="t.form.contactPlaceholder"
                   class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 outline-none
                          focus:ring-2 focus:ring-primary/50 text-label-md font-heading"/>
          </div>
          <div class="space-y-2">
            <label for="location-phone" class="text-label-md font-heading font-semibold text-on-surface">{{ t.form.phone }}</label>
            <input id="location-phone" formControlName="contactPhone" [placeholder]="c.form.optional"
                   class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 outline-none
                          focus:ring-2 focus:ring-primary/50 text-label-md font-heading"/>
          </div>
        </div>
      </form>

      <div class="px-8 py-5 border-t border-outline-variant/20 flex justify-end gap-3 bg-white">
        <button type="button" (click)="cancel.emit()"
                class="px-6 py-3 rounded-full text-label-md font-heading font-bold
                       text-on-surface-variant hover:bg-surface-container-low transition-colors">
          {{ c.actions.cancel }}
        </button>
        <button type="submit" form="location-form"
                class="px-8 py-3 gradient-primary text-white rounded-full text-label-md
                       font-heading font-bold hover:opacity-90 active:scale-95 transition-all shadow-primary">
          {{ c.actions.create }}
        </button>
      </div>
    </div>
  </div>
}
