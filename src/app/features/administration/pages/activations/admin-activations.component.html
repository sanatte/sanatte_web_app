<section class="px-4 md:px-8 lg:px-container-padding-desktop py-6 max-w-[1400px] mx-auto space-y-6">

  <!-- Header + KPIs -->
  <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6">
    <div>
      <nav class="flex items-center gap-1 text-label-sm font-heading text-outline
                  font-bold uppercase tracking-wider mb-2">
        <span>Admin</span>
        <span class="material-symbols-outlined text-[14px]">chevron_right</span>
        <span class="text-primary">Activaciones</span>
      </nav>
      <app-admin-page-header
        title="Gestión de Activaciones"
        description="Control de licencias físicas y vinculación de códigos QR." />
    </div>

    <!-- KPI chips -->
    <div class="flex flex-wrap gap-3 shrink-0">
      <div class="glass-card px-5 py-4 rounded-lg flex items-center gap-4 min-w-[160px]">
        <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center">
          <span class="material-symbols-outlined text-primary text-[20px]">verified</span>
        </div>
        <div>
          <p class="text-label-sm font-heading text-on-surface-variant uppercase tracking-wide">
            Total activas
          </p>
          <p class="font-heading font-bold text-on-surface text-headline-md">
            {{ stats().total | number }}
          </p>
        </div>
      </div>
      <div class="glass-card px-5 py-4 rounded-lg flex items-center gap-4 min-w-[160px]">
        <div class="w-10 h-10 bg-secondary/10 rounded-full flex items-center justify-center">
          <span class="material-symbols-outlined text-secondary text-[20px]">pending_actions</span>
        </div>
        <div>
          <p class="text-label-sm font-heading text-on-surface-variant uppercase tracking-wide">
            Pendientes
          </p>
          <p class="font-heading font-bold text-on-surface text-headline-md">
            {{ stats().pending | number }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="glass-card rounded-lg p-4 flex flex-wrap items-center gap-3">
    <div class="flex-1 min-w-[220px]">
      <app-search-input
        placeholder="Buscar por código, producto o email..."
        (search)="onSearch($event)" />
    </div>
    <select (change)="onStatusChange($event)"
            class="px-5 py-2.5 bg-surface-container-low border border-outline-variant
                   rounded-full text-label-md font-heading focus:ring-2 focus:ring-primary/20
                   outline-none cursor-pointer">
      @for (opt of statusOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
    <div class="flex items-center gap-2 px-5 py-2.5 bg-surface-container-low border
                border-outline-variant rounded-full cursor-pointer hover:border-primary/40
                transition-colors">
      <span class="material-symbols-outlined text-outline text-[18px]">calendar_today</span>
      <span class="text-label-md font-heading text-on-surface-variant">Últimos 30 días</span>
    </div>
    <button class="ml-auto flex items-center gap-2 px-5 py-2.5 gradient-primary text-white
                   rounded-full text-label-md font-heading font-semibold hover:opacity-90
                   active:scale-95 transition-all"
            style="box-shadow: 0 4px 14px rgba(107,56,212,0.25)">
      <span class="material-symbols-outlined text-[18px]">download</span>
      <span class="hidden sm:inline">Exportar CSV</span>
    </button>
  </div>

  <!-- Table -->
  <app-activation-table
    [activations]="paginated()"
    [totalItems]="filtered().length"
    [currentPage]="currentPage()"
    [pageSize]="10"
    (viewDetail)="onViewDetail($event)"
    (revoke)="onRevoke($event)"
    (pageChange)="onPageChange($event)" />


</section>

<!-- Confirm Revoke -->
<app-confirm-dialog
  [open]="isConfirmOpen()"
  title="Revocar activación"
  [message]="'¿Revocar la activación de ' + (activationToRevoke()?.licenseCode ?? '') + '? El usuario perderá acceso a los recursos desbloqueados.'"
  confirmText="Sí, revocar"
  variant="danger"
  (confirm)="confirmRevoke()"
  (cancel)="cancelRevoke()" />
