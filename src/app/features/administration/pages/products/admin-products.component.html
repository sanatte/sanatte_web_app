<section class="px-4 md:px-8 lg:px-container-padding-desktop py-6 max-w-[1400px] mx-auto">

  <app-admin-page-header
    [title]="t.page.title"
    [description]="t.page.description"
    [actionLabel]="t.page.create"
    (action)="openCreate()" />

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
    <div class="w-full sm:w-80">
      <app-search-input [placeholder]="t.page.searchPlaceholder" (search)="onSearch($event)" />
    </div>
    <p class="text-label-sm font-heading text-on-surface-variant">
      {{ t.page.found(filtered().length) }}
    </p>
  </div>

  <app-product-table
    [products]="paginated()"
    [totalItems]="filtered().length"
    [currentPage]="currentPage()"
    [pageSize]="8"
    (editProduct)="openEdit($event)"
    (deleteProduct)="requestDelete($event)"
    (pageChange)="onPageChange($event)" />

</section>

<app-product-form-dialog
  [isOpen]="isModalOpen()"
  [product]="editingProduct()"
  [saving]="saving()"
  [errorMessage]="saveError()"
  (save)="onSave($event)"
  (cancel)="closeModal()" />

<app-confirm-dialog
  [open]="isConfirmOpen()"
  [title]="t.deleteTitle"
  [message]="deleteMessage()"
  [errorMessage]="deleteError()"
  [confirmText]="t.deleteConfirm"
  variant="danger"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()" />
